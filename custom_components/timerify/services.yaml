add_time:
  target:
    entity:
      integration: timerify
      domain: number
  fields:
    minutes:
      required: true
      example: 15
      selector:
        number:
          min: -1440
          max: 1440
          step: 1
          mode: box
          unit_of_measurement: min
run:
  target:
    entity:
      integration: timerify
      domain: number
  fields:
    minutes:
      example: 60
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          mode: box
          unit_of_measurement: min
    settings: &settings
      collapsed: true
      fields:
        hvac_mode:
          example: cool
          selector:
            select:
              translation_key: hvac_mode
              options:
                - heat
                - cool
                - heat_cool
                - auto
                - dry
                - fan_only
        temperature:
          example: 24
          selector:
            number:
              min: 0
              max: 250
              step: 0.1
              mode: box
        fan_mode:
          example: auto
          selector:
            text:
        preset_mode:
          example: sleep
          selector:
            text:
        mode:
          example: away
          selector:
            text:
        operation_mode:
          example: eco
          selector:
            text:
        brightness_pct:
          example: 80
          selector:
            number:
              min: 1
              max: 100
              mode: slider
              unit_of_measurement: "%"
        percentage:
          example: 50
          selector:
            number:
              min: 1
              max: 100
              mode: slider
              unit_of_measurement: "%"
        humidity:
          example: 55
          selector:
            number:
              min: 1
              max: 100
              mode: slider
              unit_of_measurement: "%"
stop:
  target:
    entity:
      integration: timerify
      domain: number
add_command:
  target:
    entity:
      integration: timerify
      domain: number
  fields:
    action:
      required: true
      example: "on"
      selector:
        select:
          translation_key: command_action
          options:
            - "on"
            - "off"
    delay:
      example: 15
      selector:
        number:
          min: 1
          max: 10080
          step: 1
          mode: box
          unit_of_measurement: min
    at:
      example: "2026-01-05 19:30:00"
      selector:
        datetime:
    minutes:
      example: 60
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          mode: box
          unit_of_measurement: min
    settings: *settings
cancel_command:
  target:
    entity:
      integration: timerify
      domain: number
  fields:
    command_id:
      required: true
      example: "0f5c1e2a7d9b4c3e8a6b1d2c3e4f5a6b"
      selector:
        text:
