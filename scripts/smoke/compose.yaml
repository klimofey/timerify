# A real Home Assistant for the smoke test (scripts/smoke/run.py), with Timerify
# mounted read-only. The configuration lives in ./config, which is throwaway; only
# configuration.yaml is kept in the repository and mounted over its copy.
name: timerify-smoke

x-image: &image ghcr.io/home-assistant/home-assistant:2026.10.4

services:
  homeassistant:
    image: *image
    ports:
      - "127.0.0.1:18123:8123"
    environment:
      TZ: UTC
    volumes:
      - ./config:/config
      - ./configuration.yaml:/config/configuration.yaml:ro
      - ../../custom_components:/config/custom_components:ro

  # Empties ./config whatever user owns its files (Home Assistant runs as root).
  # `docker compose run --rm wipe`
  wipe:
    image: *image
    profiles: [tools]
    entrypoint: [find, /config, -mindepth, "1", -delete]
    volumes:
      - ./config:/config
