# The Russian answers of the voice, one for each class of counts.
#
# They are written by hand, from the rules of Russian plurals, and read by the owner. They
# are not produced by the templates: a fixture rendered from the templates would only
# repeat them. A change to a Russian answer changes this file in the same commit.
#
# A case is the answer a speaker expects (`answer`) for the slots a handler gives it
# (`slots`), where `count` is the number of `unit` in them. After a count Russian puts the
# noun in the form of the count's last digits:
#   one   1, 21, 31, but not 11             1 минута, 21 минута, 1 час, 21 час
#   few   2 to 4, 22 to 24, but not 12-14   2 минуты, 22 минуты, 2 часа
#   many  0, 5 to 20, 25 to 30              5 минут, 11 минут, 5 часов, 11 часов
# A verb that goes with the count (remains, is planned, is cancelled) agrees with the noun
# for a "one" count and is neuter for every other: "осталась 21 минута", "остался 21 час",
# "осталось 5 минут". In the time left it goes with the first noun, the hours.
#
# A count of commands from 5 on has one command in its list, to keep the answer short: the
# form of the noun depends on the count alone.

# How long is left on the boiler

- intent: TimerifyTimeLeft
  response: default
  unit: minutes
  count: 1
  answer: "Boiler: осталась 1 минута, выключится в 11:00."
  slots: {state: counting, target: Boiler, left_total: 1, left_hours: 0, left_minutes: 1, ends_at: "11:00", ends_in_days: 0}

