# Timerify's sentences for the built-in agent, in Russian: the source of
# sentences/ru/timerify.yaml, which scripts/generate_sentences.py writes from this file
# and macros.jinja. Edit these two, never the file it writes.
#
# The list timerify_target is empty here: the names of the devices that have a timer are
# put into it, either by the Voice settings entry of Timerify, which writes this file
# and the names to custom_sentences/ru/timerify.yaml, or by hand, as the README says. So
# are timerify_mode, the modes that the devices take besides the HVAC modes (the fan
# mode of a thermostat, the preset of a fan, the mode of a humidifier),
# timerify_interval, the titles of the schedule intervals, and timerify_hvac_mode, which
# the Voice settings entry cuts down to the HVAC modes that the devices have.
#
# A setting is said only of a device that has it: the names in timerify_target carry the
# domain of their device, and a block of TimerifyRun below takes the names of the domains
# whose settings it lists. So "auto" is the mode of a humidifier and a fan, and the HVAC
# mode only of a thermostat, and a temperature is said only of a thermostat or a water
# heater. A name listed by hand has to carry its domain for the same reason.
#
# A name cannot be declined, so the sentences put it where the nominative is natural,
# and an answer starts with it, followed by a colon.
language: ru
intents:
  TimerifyTimeLeft:
    data:
      - sentences:
          - "сколько [времени] осталось (у таймера|на таймере) {timerify_target:name}"
          - "через сколько (выключится|отключится) {timerify_target:name}"
          - "когда (выключится|отключится) {timerify_target:name}"
          - "сколько [ещё|еще] будет работать {timerify_target:name}"
  TimerifyRun:
    data:
      - sentences:
          - "(поставь|установи|заведи) таймер {timerify_target:name} на <timerify_duration>"
      # The same sentence for every kind of device, each with the settings of its own:
      # the other devices, thermostats and water heaters. A block's timerify_settings is
      # one or more of its settings, in any order, and never nothing: the delayed
      # commands of core_commands.yaml (generated by scripts/generate_core_commands.py)
      # take these blocks' contexts and rules for their own, so that a command to turn
      # on after a delay is said with the settings of the same devices.
      - sentences: &timerify_run_with_settings
          - "<timerify_turn_on> {timerify_target:name} на <timerify_duration> [<timerify_settings>]"
        excludes_context:
          domain: [climate, water_heater]
        expansion_rules:
          timerify_settings: "(<timerify_percent_part> [<timerify_mode_part>]\
            |<timerify_mode_part> [<timerify_percent_part>])"
      - sentences: *timerify_run_with_settings
        requires_context:
          domain: climate
        expansion_rules:
          timerify_settings: "(<timerify_hvac_part> ([<timerify_temperature_part>]; [<timerify_percent_part>]; [<timerify_mode_part>])\
            |<timerify_temperature_part> ([<timerify_hvac_part>]; [<timerify_percent_part>]; [<timerify_mode_part>])\
            |<timerify_percent_part> ([<timerify_hvac_part>]; [<timerify_temperature_part>]; [<timerify_mode_part>])\
            |<timerify_mode_part> ([<timerify_hvac_part>]; [<timerify_temperature_part>]; [<timerify_percent_part>]))"
      - sentences: *timerify_run_with_settings
        requires_context:
          domain: water_heater
        expansion_rules:
          timerify_settings: "(<timerify_temperature_part> ([<timerify_percent_part>]; [<timerify_mode_part>])\
            |<timerify_percent_part> ([<timerify_temperature_part>]; [<timerify_mode_part>])\
            |<timerify_mode_part> ([<timerify_temperature_part>]; [<timerify_percent_part>]))"
  TimerifyAddTime:
    data:
      - sentences:
          - "(добавь|прибавь|накинь) [ещё|еще] <timerify_duration> (к таймеру|таймеру|к|для) {timerify_target:name}"
          - "(ещё|еще) <timerify_duration> (к таймеру|таймеру|для) {timerify_target:name}"
          - "продли [таймер] {timerify_target:name} на <timerify_duration>"
  TimerifyStop:
    data:
      - sentences:
          - "(останови|отмени|сбрось|выключи|отключи) таймер [у|на|для] {timerify_target:name}"
  TimerifyListCommands:
    data:
      - sentences:
          - "что (запланировано|назначено) (у таймера|на таймере|для таймера) {timerify_target:name}"
          - "какие команды (запланированы|назначены|отложены) (у таймера|на таймере|для таймера) {timerify_target:name}"
  TimerifyCancelCommands:
    data:
      - sentences:
          - "(отмени|удали|сбрось) [все] (запланированные|назначенные|отложенные) команды (у таймера|на таймере|для таймера) {timerify_target:name}"
        slots:
          which: "all"
      - sentences:
          - "(отмени|удали|сбрось) (следующую|ближайшую) (запланированную|назначенную|отложенную) команду (у таймера|на таймере|для таймера) {timerify_target:name}"
        slots:
          which: "next"
  TimerifySetSchedule:
    data:
      # The whole schedule of a device, or the interval of a title: on and off are
      # separate blocks, each fixing what it means. An interval is said by its title,
      # which timerify_interval holds, after the noun, since a title cannot be declined.
      - sentences:
          - "<timerify_schedule_verb> расписание (у таймера|на таймере|для таймера|таймера) {timerify_target:name}"
          - "<timerify_schedule_verb> (расписание|интервал) {timerify_interval:interval} (у таймера|на таймере|для таймера|таймера) {timerify_target:name}"
        slots:
          enabled: true
        expansion_rules:
          timerify_schedule_verb: "(включи|включить|активируй|возобнови|возобновить)"
      - sentences:
          - "<timerify_schedule_verb> расписание (у таймера|на таймере|для таймера|таймера) {timerify_target:name}"
          - "<timerify_schedule_verb> (расписание|интервал) {timerify_interval:interval} (у таймера|на таймере|для таймера|таймера) {timerify_target:name}"
        slots:
          enabled: false
        expansion_rules:
          timerify_schedule_verb: "(выключи|выключить|отключи|отключить|деактивируй|останови|остановить|приостанови|приостановить)"
# How long: hours and minutes, each alone or both, or a phrase such as "полчаса".
expansion_rules:
  timerify_turn_on: "(включи|запусти)[ть]"
  timerify_duration: "(<timerify_hours_part> [[и] <timerify_minutes_part>]|<timerify_minutes_part>|{timerify_duration_words:minutes})"
  timerify_hours_part: "{timerify_hours:hours} час[а|ов]"
  timerify_minutes_part: "<timerify_minutes_count> минут[у|ы]"
  timerify_minutes_count: "({timerify_minutes:minutes}|{timerify_long_minutes:minutes})"
# How long a command that turns a device on runs for, said before or after the delay of
# core_commands.yaml.
  timerify_for_part: "на <timerify_duration>"
# What to turn a device on with, in any order, each part left out when it is not wanted:
# an HVAC mode, a temperature, a percentage, and a mode of the device. Which of them a
# device may be turned on with is the rule timerify_settings of each block of TimerifyRun.
  timerify_hvac_part: "[(в режиме|режим)] {timerify_hvac_mode:hvac_mode}"
  timerify_temperature_part: "[на] {timerify_temperature:temperature} [градус[а|ов]]"
  timerify_percent_part: "[на] {timerify_percent:percent} процент[а|ов]"
  timerify_mode_part: "[(в режиме|режим|вентилятор)] {timerify_mode:mode}"
lists:
  timerify_target:
    values: []
  # How long can be said reaches a week, in hours and in minutes: a timer never runs for
  # more than a day, and a duration beyond it must reach the handler, which clamps it when
  # time is added and refuses it when the timer is run, not be answered as not understood.
  # Minutes can be said as words up to a day; the minutes beyond it are a list of digits
  # only that fills the same slot, because the first request in a language builds a table
  # of the number words of every range that allows words, and for a week of minutes that
  # table takes seconds and over 100 MB (RULINGS.md, the duration entry).
  timerify_hours:
    range:
      from: 1
      to: 168
  timerify_minutes:
    range:
      from: 1
      to: 1440
  timerify_long_minutes:
    range:
      from: 1441
      to: 10080
      words: false
  timerify_temperature:
    range:
      from: 1
      to: 100
      fractions: halves
  timerify_percent:
    range:
      from: 1
      to: 100
  timerify_duration_words:
    values:
      - in: "час"
        out: 60
      - in: "полчаса"
        out: 30
      - in: "полтора часа"
        out: 90
  timerify_hvac_mode:
    values:
      - in: "(охлаждени(е|я)|холод)"
        out: cool
      - in: "(обогрев|нагрев|отоплени(е|я)|тепло)"
        out: heat
      - in: "(осушени(е|я)|сушка)"
        out: dry
      - in: "(вентиляци(я|и)|только вентилятор)"
        out: fan_only
      - in: "(авто|автоматическ(ий|и))"
        out: auto
      - in: "(тепло и холод|обогрев и охлаждение|нагрев и охлаждение)"
        out: heat_cool
  timerify_mode:
    values: []
  timerify_interval:
    values: []
# An answer calls the macros of macros.jinja by name.
responses:
  intents:
    TimerifyTimeLeft:
      default: |-
        {%- if slots.state == "counting" -%}
          {%- set parts = [] -%}
          {%- if slots.left_hours > 0 -%}
            {%- set parts = parts + [slots.left_hours ~ " " ~ plural(slots.left_hours, "час", "часа", "часов")] -%}
          {%- endif -%}
          {%- if slots.left_minutes > 0 -%}
            {%- set parts = parts + [slots.left_minutes ~ " " ~ plural(slots.left_minutes, "минута", "минуты", "минут")] -%}
          {%- endif -%}
          {%- set first = slots.left_hours if slots.left_hours > 0 else slots.left_minutes -%}
          {%- if first % 10 == 1 and first % 100 != 11 -%}
            {%- set verb = "остался" if slots.left_hours > 0 else "осталась" -%}
          {%- else -%}
            {%- set verb = "осталось" -%}
          {%- endif -%}
          {{ slots.target }}: {{ verb }} {{ parts | join(" и ") }}, выключится {{ day(slots.ends_in_days) }}в {{ slots.ends_at }}.
        {%- elif slots.state == "open" -%}
          {{ slots.target }}: включено без таймера.
        {%- else -%}
          {{ slots.target }}: выключено, таймера нет.
        {%- endif -%}
    TimerifyRun:
      default: "{{ timer_now(slots) }}"
    TimerifyAddTime:
      default: "{{ timer_now(slots) }}"
    TimerifyStop:
      default: "{{ timer_now(slots) }}"
    TimerifyDelayedCommand:
      delayed: "{{ timer_later(slots) }}"
    TimerifyListCommands:
      default: |-
        {%- if slots.count == 0 -%}
          {{ slots.target }}: запланированных команд нет.
        {%- else -%}
          {{ slots.target }}: {{ plural(slots.count, "запланирована", "запланировано", "запланировано") }} {{ slots.count }} {{ plural(slots.count, "команда", "команды", "команд") }}: {{ planned_commands(slots.commands) }}.
        {%- endif -%}
    TimerifyCancelCommands:
      default: |-
        {%- if slots.cancelled == 0 -%}
          {{ slots.target }}: запланированных команд нет, отменять нечего.
        {%- elif slots.which == "next" -%}
          {{ slots.target }}: отменена ближайшая запланированная команда: {{ planned_command(slots.commands[0]) }}.
        {%- else -%}
          {{ slots.target }}: {{ plural(slots.cancelled, "отменена", "отменено", "отменено") }} {{ slots.cancelled }} {{ plural(slots.cancelled, "запланированная команда", "запланированные команды", "запланированных команд") }}.
        {%- endif -%}
    TimerifySetSchedule:
      default: |-
        {%- if slots.interval -%}
          {{ slots.target }}: расписание «{{ slots.interval }}» {{ "включено" if slots.enabled else "выключено" }}.
        {%- else -%}
          {{ slots.target }}: расписание {{ "включено" if slots.enabled else "выключено" }}.
        {%- endif -%}
