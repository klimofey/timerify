# A real Home Assistant for the smoke test (scripts/smoke/run.py) and for the end-to-end
# tests of the dashboard card (scripts/e2e/hass.py), with Timerify mounted read-only.
# scripts/harness/hass.py runs this file under a project name of its own, with the port
# and the configuration directory of the instance in TIMERIFY_HA_PORT and
# TIMERIFY_HA_CONFIG, so the two can run side by side. The configuration directory is
# throwaway; only configuration.yaml is kept in the repository and mounted over its copy.

x-image: &image ghcr.io/home-assistant/home-assistant:2026.10.4

services:
  homeassistant:
    image: *image
    ports:
      - "127.0.0.1:${TIMERIFY_HA_PORT:?}:8123"
    environment:
      TZ: UTC
    volumes:
      - ${TIMERIFY_HA_CONFIG:?}:/config
      - ./configuration.yaml:/config/configuration.yaml:ro
      - ../../custom_components:/config/custom_components:ro

  # Empties the configuration directory whatever user owns its files (Home Assistant
  # runs as root). `docker compose run --rm wipe`
  wipe:
    image: *image
    profiles: [tools]
    entrypoint: [find, /config, -mindepth, "1", -delete]
    volumes:
      - ${TIMERIFY_HA_CONFIG:?}:/config
