add_time:
  target:
    entity:
      integration: timerify
      domain: number
  fields:
    minutes:
      required: true
      example: 15
      selector:
        number:
          min: -1440
          max: 1440
          step: 1
          mode: box
          unit_of_measurement: min
run:
  target:
    entity:
      integration: timerify
      domain: number
  fields:
    minutes:
      example: 60
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          mode: box
          unit_of_measurement: min
    settings: &settings
      collapsed: true
      fields:
        hvac_mode:
          example: cool
          selector:
            select:
              translation_key: hvac_mode
              options:
                - heat
                - cool
                - heat_cool
                - auto
                - dry
                - fan_only
        temperature:
          example: 24
          selector:
            number:
              min: 0
              max: 250
              step: 0.1
              mode: box
        fan_mode:
          example: auto
          selector:
            text:
        preset_mode:
          example: sleep
          selector:
            text:
        mode:
          example: away
          selector:
            text:
        operation_mode:
          example: eco
          selector:
            text:
        brightness_pct:
          example: 80
          selector:
            number:
              min: 1
              max: 100
              mode: slider
              unit_of_measurement: "%"
        percentage:
          example: 50
          selector:
            number:
              min: 1
              max: 100
              mode: slider
              unit_of_measurement: "%"
        humidity:
          example: 55
          selector:
            number:
              min: 1
              max: 100
              mode: slider
              unit_of_measurement: "%"
