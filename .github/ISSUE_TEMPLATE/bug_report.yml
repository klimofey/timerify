name: Bug report
description: Something in Timerify does not work the way the docs say.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please update to the latest release first, the bug may be fixed already.
        You can write in English or Russian.
  - type: input
    id: timerify_version
    attributes:
      label: Timerify version
      description: HACS shows it on the Timerify page.
      placeholder: "1.3.1"
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      description: Settings > About.
      placeholder: "2026.11.0"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where is the problem?
      options:
        - The timer itself (Run for, Ends at, turning the device on and off)
        - Pending commands
        - Weekly schedule
        - Limit for a device left on
        - Runtime sensor
        - Voice (Assist)
        - LLM tools
        - Dashboard card
        - Automations (Timerify triggers and actions)
        - Setup or settings forms
        - Something else
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: The device the timer runs
      description: Its entity id and the integration it comes from.
      placeholder: "switch.boiler, from Shelly"
  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: What you did, step by step. What you expected. What happened instead.
    validations:
      required: true
  - type: input
    id: sentence
    attributes:
      label: The sentence you said
      description: Only for voice. The exact words, and the language of your assistant.
      placeholder: "turn on the boiler for 10 minutes (English)"
  - type: textarea
    id: card_config
    attributes:
      label: Card configuration
      description: Only for the card. In the card editor, choose Show code editor and copy the YAML.
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: |
        On the Timerify integration page, choose Enable debug logging. Do the steps again, then choose Disable debug logging.
        Home Assistant then offers the log to download. Paste the lines that mention timerify.
      render: text
