responses:
  intents:
    TimerifyTimeLeft:
      default: |-
        {%- macro plural(n, one, other) -%}
          {%- if n == 1 -%}
            {{ one }}
          {%- else -%}
            {{ other }}
          {%- endif -%}
        {%- endmacro -%}
        {%- macro day(n) -%}
          {%- if n == 1 -%}
            {{ " tomorrow" }}
          {%- elif n == 2 -%}
            {{ " the day after tomorrow" }}
          {%- elif n > 2 -%}
            {{ " in " ~ n ~ " days" }}
          {%- endif -%}
        {%- endmacro -%}
        {%- macro duration(hours, minutes) -%}
          {%- set parts = [] -%}
          {%- if hours > 0 -%}
            {%- set parts = parts + [hours ~ " " ~ plural(hours, "hour", "hours")] -%}
          {%- endif -%}
          {%- if minutes > 0 -%}
            {%- set parts = parts + [minutes ~ " " ~ plural(minutes, "minute", "minutes")] -%}
          {%- endif -%}
          {{- parts | join(" and ") -}}
        {%- endmacro -%}
        {%- if slots.state == "counting" -%}
          {{ duration(slots.left_hours, slots.left_minutes) }} left on {{ slots.target }}, it turns off at {{ slots.ends_at }}{{ day(slots.ends_in_days) }}.
        {%- elif slots.state == "limit" -%}
          {{ slots.target }} turns off by {{ slots.ends_at }}{{ day(slots.ends_in_days) }} at the latest.
        {%- elif slots.state == "open" -%}
          {{ slots.target }} is on without a timer.
        {%- elif slots.state == "unavailable" -%}
          {{ slots.target }} is unavailable and has no timer.
        {%- else -%}
          {{ slots.target }} is off and has no timer.
        {%- endif -%}
    TimerifyRun:
      default: |-
        {%- macro plural(n, one, other) -%}
          {%- if n == 1 -%}
            {{ one }}
          {%- else -%}
            {{ other }}
