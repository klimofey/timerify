[project]
name = "timerify"
version = "0.0.0"
description = "Home Assistant integration that attaches countdowns, auto-off and schedules to existing entities"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.375",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF", "PT"]
