  said: "в двадцать минут восьмого вечера"
  now: "06:00"
  days: 0
  clock: "19:20"

- name: a quarter short of eight
  said: "без четверти восемь"
  now: "06:00"
  days: 0
  clock: "07:45"

- name: a quarter short of eight, said at ten to eight in the evening
  said: "без четверти восемь"
  now: "19:50"
  days: 1
  clock: "07:45"

- name: five short of eight
  said: "без пяти восемь"
  now: "06:00"
  days: 0
  clock: "07:55"

