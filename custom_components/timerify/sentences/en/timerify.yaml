# Generated by scripts/generate_sentences.py from src/timerify.yaml and src/macros.jinja:
# do not edit this file. Edit the sources and run `uv run python -m scripts.generate_sentences`.
language: en
intents:
  TimerifyTimeLeft:
    data:
    - sentences:
      - how (much time|long) is left (on|for) [<the>] {timerify_target:name}
      - how long will [<the>] {timerify_target:name} (run|stay on|be on|keep running)
      - (when|what time) (does|will) [<the>] {timerify_target:name} (turn|switch|shut) off
  TimerifyRun:
    data:
    - sentences:
      - set [<the>] {timerify_target:name} timer to <timerify_duration>
    - sentences:
      - <turn> on [<the>] {timerify_target:name} for <timerify_duration> [<timerify_settings>]
      - <turn> [<the>] {timerify_target:name} on for <timerify_duration> [<timerify_settings>]
      - run [<the>] {timerify_target:name} for <timerify_duration> [<timerify_settings>]
      excludes_context:
        domain:
        - climate
        - water_heater
      expansion_rules:
        timerify_settings: (<timerify_percent_part> [<timerify_mode_part>]|<timerify_mode_part> [<timerify_percent_part>])
    - sentences:
      - <turn> on [<the>] {timerify_target:name} for <timerify_duration> [<timerify_settings>]
      - <turn> [<the>] {timerify_target:name} on for <timerify_duration> [<timerify_settings>]
      - run [<the>] {timerify_target:name} for <timerify_duration> [<timerify_settings>]
      requires_context:
        domain: climate
      expansion_rules:
        timerify_duration: <timerify_duration_with_and>
        timerify_settings: (<timerify_hvac_part> ([<timerify_temperature_part>]; [<timerify_percent_part>]; [<timerify_mode_part>])|<timerify_temperature_part> ([<timerify_hvac_part>]; [<timerify_percent_part>]; [<timerify_mode_part>])|<timerify_percent_part> ([<timerify_hvac_part>]; [<timerify_temperature_part>]; [<timerify_mode_part>])|<timerify_mode_part> ([<timerify_hvac_part>]; [<timerify_temperature_part>]; [<timerify_percent_part>]))
    - sentences:
      - <turn> on [<the>] {timerify_target:name} for <timerify_duration> [<timerify_settings>]
      - <turn> [<the>] {timerify_target:name} on for <timerify_duration> [<timerify_settings>]
      - run [<the>] {timerify_target:name} for <timerify_duration> [<timerify_settings>]
      requires_context:
        domain: water_heater
      expansion_rules:
        timerify_duration: <timerify_duration_with_and>
        timerify_settings: (<timerify_temperature_part> ([<timerify_percent_part>]; [<timerify_mode_part>])|<timerify_percent_part> ([<timerify_temperature_part>]; [<timerify_mode_part>])|<timerify_mode_part> ([<timerify_temperature_part>]; [<timerify_percent_part>]))
  TimerifyAddTime:
    data:
    - sentences:
      - add (<timerify_duration>|<timerify_more_duration>) to [<the>] {timerify_target:name}
      - (<timerify_duration> more|<timerify_more_duration>) on [<the>] {timerify_target:name}
      - extend [<the>] {timerify_target:name} by <timerify_duration>
  TimerifyStop:
    data:
    - sentences:
      - (stop|cancel) [<the>] {timerify_target:name} timer
      - (stop|cancel) the timer (on|of) [<the>] {timerify_target:name}
  TimerifyListCommands:
    data:
    - sentences:
      - what is (planned|scheduled) for [<the>] {timerify_target:name}
      - what (commands are|is) pending (for|on) [<the>] {timerify_target:name}
  TimerifyCancelCommands:
    data:
    - sentences:
      - cancel (the|all) (planned|pending) commands (for|of) [<the>] {timerify_target:name}
      slots:
        which: all
    - sentences:
      - cancel the next (planned|pending) command (for|of) [<the>] {timerify_target:name}
      slots:
        which: next
  TimerifySetSchedule:
    data:
    - sentences:
      - <turn> on [<the>] {timerify_target:name} schedule
      - <turn> [<the>] {timerify_target:name} schedule on
      - <turn> on the schedule (of|for) [<the>] {timerify_target:name}
      - <turn> the schedule (of|for) [<the>] {timerify_target:name} on
      - (enable|resume) [<the>] {timerify_target:name} schedule
      - (enable|resume) the schedule (of|for) [<the>] {timerify_target:name}
      - <turn> on [<the>] {timerify_interval:interval} schedule (of|for) [<the>] {timerify_target:name}
      - <turn> [<the>] {timerify_interval:interval} schedule (of|for) [<the>] {timerify_target:name} on
      - (enable|resume) [<the>] {timerify_interval:interval} schedule (of|for) [<the>] {timerify_target:name}
      slots:
        enabled: true
    - sentences:
      - <turn> off [<the>] {timerify_target:name} schedule
      - <turn> [<the>] {timerify_target:name} schedule off
      - <turn> off the schedule (of|for) [<the>] {timerify_target:name}
      - <turn> the schedule (of|for) [<the>] {timerify_target:name} off
      - (disable|pause) [<the>] {timerify_target:name} schedule
      - (disable|pause) the schedule (of|for) [<the>] {timerify_target:name}
      - <turn> off [<the>] {timerify_interval:interval} schedule (of|for) [<the>] {timerify_target:name}
      - <turn> [<the>] {timerify_interval:interval} schedule (of|for) [<the>] {timerify_target:name} off
      - (disable|pause) [<the>] {timerify_interval:interval} schedule (of|for) [<the>] {timerify_target:name}
      slots:
        enabled: false
expansion_rules:
  timerify_spelled_duration: (<timerify_hours_part> [[and] <timerify_minutes_part>]|<timerify_minutes_part>|{timerify_duration_words:minutes})
  timerify_duration_with_and: (<timerify_spelled_duration>|<timerify_hours_part> and {timerify_minutes_of_hour:minutes})
  timerify_duration: (<timerify_spelled_duration>|<timerify_hours_part> [and] {timerify_minutes_of_hour:minutes})
  timerify_more_duration: ({timerify_hours:hours} more hour[s]|<timerify_minutes_count> more minute[s])
  timerify_hours_part: '{timerify_hours:hours} hour[s]'
  timerify_minutes_part: <timerify_minutes_count> minute[s]
  timerify_minutes_count: ({timerify_minutes:minutes}|{timerify_long_minutes:minutes})
  timerify_for_part: for <timerify_duration>
  timerify_hvac_part: '{timerify_hvac_mode:hvac_mode} [mode]'
  timerify_temperature_part: '[at] {timerify_temperature:temperature} [degree[s]]'
  timerify_percent_part: '[at] {timerify_percent:percent} percent'
  timerify_mode_part: '[in] [fan] {timerify_mode:mode} [mode|fan]'
lists:
  timerify_target:
    values: []
  timerify_hours:
    range:
      from: 1
      to: 168
  timerify_minutes:
    range:
      from: 1
      to: 1440
  timerify_long_minutes:
    range:
      from: 1441
      to: 10080
      words: false
  timerify_minutes_of_hour:
    range:
      from: 1
      to: 59
  timerify_temperature:
    range:
      from: 1
      to: 250
      fractions: halves
  timerify_percent:
    range:
      from: 1
      to: 100
  timerify_duration_words:
    values:
    - in: an hour
      out: 60
    - in: half an hour
      out: 30
    - in: an hour and a half
      out: 90
  timerify_hvac_mode:
    values:
    - in: (cool|cooling)
      out: cool
    - in: (heat|heating)
      out: heat
    - in: (dry|drying)
      out: dry
    - in: fan only
      out: fan_only
    - in: auto
      out: auto
    - in: heat and cool
      out: heat_cool
  timerify_mode:
    values: []
  timerify_interval:
    values: []
