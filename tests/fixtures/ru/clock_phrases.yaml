# The Russian clock times that count minutes around an hour, written by hand.
#
# They are not produced by the grammar: a fixture sampled from the sentences would only
# repeat them. Each case is a phrase a speaker of Russian says after "включи Boiler"
# (`said`), the time of the day it is said at on a Sunday (`now`, "HH:MM"), and what the
# speaker means, which is of exactly one of three kinds:
#
# - the time (`clock`, "HH:MM", on the day that is `days` after Sunday);
# - a time that has passed, which the day word makes a refusal (`refused`, the "HH:MM"
#   that the refusal names);
# - no clock time at all (`understood: false`).
#
# Russian counts minutes to the next hour. The half or the quarter or N minutes are said
# with the genitive of the ordinal of the hour counted to: "в половине восьмого" is half
# of the eighth hour, the one that runs from 07:00 to 08:00, so it is 07:30, and "в
# четверть восьмого" is 07:15. The half is also "в полвосьмого", "в пол восьмого" and "в
# половину восьмого". "Без четверти восемь" is a quarter short of eight: 07:45, and "без
# пяти минут восемь" is 07:55. After "без" the hour is a cardinal in the nominative, and
# the hour one is "час". "Без одной минуты восемь" is 07:59.
#
# An hour of 1 to 12 with no word for the part of the day is the nearer of its two times
# that is ahead, as in "в 7:30". A word for the part of the day picks which of the two
# times the minutes make: the time that is inside the hours of the part. The morning is
# 00:00 to 12:00, the afternoon 11:00 to 23:00, the evening 13:00 to 01:00 and the night
# 18:00 to 06:00. So "в половине первого ночи" is 00:30, "в половине двенадцатого утра"
# and "в половине двенадцатого дня" are 11:30, "в половине двенадцатого ночи" is 23:30,
# "без четверти двенадцать утра" is 11:45 and "без четверти двенадцать вечера" is 23:45.
# With a day word, a bare 12 is noon: "завтра в 12:30" is 12:30, and "завтра в половине
# первого" is 12:30 tomorrow (see RULINGS.md).
#
# A part of the day may be said before the time as an adverb, with or without a day word:
# "завтра утром в 7", "вечером в 9", "ночью в 2". The hour is of the twelve-hour clock and
# the adverb picks the time, as "утра" and "вечера" do after it ("в 7:30 утра", "в 9
# вечера"): "утром" is the morning, "днём" (also written "днем") the afternoon, "вечером"
# the evening, and "ночью" the night. "Вечером в 12" is the midnight that ends the
# evening. The adverb with "сегодня" names today, so "сегодня вечером в 9" said after
# 21:00 is refused and not moved to tomorrow. With no day word the time is the next one
# ahead: "вечером в 9" said after 21:00 is tomorrow's. The night after a day word is the
# night that follows that day: "завтра ночью в 2" is the 02:00 after tomorrow, and
# "сегодня ночью в 2" is the coming 02:00, the night in progress when it is said in the
# small hours.
#
# A date is no time of the day: "двадцать восьмого" is the twenty-eighth, with no word
# for minutes, and "без двадцати" counts to no hour.

