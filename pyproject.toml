[project]
name = "timerify"
version = "0.3.0"
description = "Timers for any Home Assistant entity"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
    "holidays==0.106",
    "mypy>=2.4.1",
    "pytest-homeassistant-custom-component==0.13.375",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF", "PT"]
# The title of a schedule interval has an en dash between its times, as in 06:30–07:15.
allowed-confusables = ["–"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components", "scripts"]
