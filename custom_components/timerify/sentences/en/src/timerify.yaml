# Timerify's sentences for the built-in agent, in English: the source of
# sentences/en/timerify.yaml, which scripts/generate_sentences.py writes from this file
# and macros.jinja. Edit these two, never the file it writes.
#
# The list timerify_target is empty here: the names of the devices that have a timer are
# put into it, either by the Voice settings entry of Timerify, which writes this file
# and the names to custom_sentences/en/timerify.yaml, or by hand, as the README says. So
# are timerify_mode, the modes that the devices take besides the HVAC modes (the fan
# mode of a thermostat, the preset of a fan, the mode of a humidifier),
# timerify_interval, the titles of the schedule intervals and the times that the intervals
# titled by Timerify start at. The list timerify_hvac_mode has every word for an HVAC mode
# here, for the copy made by hand. The Voice settings entry empties it, and copies each
# block for thermostats once for each set of HVAC modes that thermostats have, with a list
# of its own that has the words for those modes only.
#
# A setting is said only of a device that has it: the names in timerify_target carry the
# domain of their device, and a block of TimerifyRun below takes the names of the domains
# whose settings it lists. So "auto" is the mode of a humidifier and a fan, and the HVAC
# mode only of a thermostat, and a temperature is said only of a thermostat or a water
# heater. A name listed by hand has to carry its domain for the same reason.
language: en
intents:
  TimerifyTimeLeft:
    data:
      - sentences:
          - "how (much time|long) is left (on|for) [<the>] {timerify_target:name}"
          - "how long will [<the>] {timerify_target:name} (run|stay on|be on|keep running)"
          - "(when|what time) (does|will) [<the>] {timerify_target:name} (turn|switch|shut) off"
  TimerifyRun:
    data:
      - sentences:
          - "set [<the>] {timerify_target:name} timer to <timerify_duration>"
      # The same sentences for every kind of device, each with the settings of its own:
      # the other devices, thermostats and water heaters. A block's timerify_settings is
      # one or more of its settings, in any order, and never nothing: the delayed
      # commands of core_commands.yaml (generated by scripts/generate_core_commands.py)
      # take these blocks' contexts and rules for their own, so that "turn on in 15
      # minutes ..." is said with the settings of the same devices.
      - sentences: &timerify_run_with_settings
          - "<turn> on [<the>] {timerify_target:name} for <timerify_duration> [<timerify_settings>]"
          - "<turn> [<the>] {timerify_target:name} on for <timerify_duration> [<timerify_settings>]"
          - "run [<the>] {timerify_target:name} for <timerify_duration> [<timerify_settings>]"
        excludes_context:
          domain: [climate, water_heater]
        expansion_rules:
          timerify_settings: "(<timerify_percent_part> [<timerify_mode_part>]\
            |<timerify_mode_part> [<timerify_percent_part>])"
      - sentences: *timerify_run_with_settings
        requires_context:
          domain: climate
        expansion_rules:
          # A bare number after the hours is the temperature here; minutes need "and".
          timerify_duration: "<timerify_duration_with_and>"
          # A bare number after the settings is the temperature too: a time said there
          # must show that it is one (the delayed commands of core_commands.yaml use
          # this, not the sentences of this block).
          timerify_clock_after_extras: "<timerify_exact_clock>"
          timerify_settings: "(<timerify_hvac_part> ([<timerify_temperature_part>]; [<timerify_percent_part>]; [<timerify_mode_part>])\
            |<timerify_temperature_part> ([<timerify_hvac_part>]; [<timerify_percent_part>]; [<timerify_mode_part>])\
            |<timerify_percent_part> ([<timerify_hvac_part>]; [<timerify_temperature_part>]; [<timerify_mode_part>])\
            |<timerify_mode_part> ([<timerify_hvac_part>]; [<timerify_temperature_part>]; [<timerify_percent_part>]))"
      - sentences: *timerify_run_with_settings
        requires_context:
          domain: water_heater
        expansion_rules:
          # A bare number after the hours is the temperature here; minutes need "and".
          timerify_duration: "<timerify_duration_with_and>"
          # A bare number after the settings is the temperature too: a time said there
          # must show that it is one (the delayed commands of core_commands.yaml use
          # this, not the sentences of this block).
          timerify_clock_after_extras: "<timerify_exact_clock>"
          timerify_settings: "(<timerify_temperature_part> ([<timerify_percent_part>]; [<timerify_mode_part>])\
            |<timerify_percent_part> ([<timerify_temperature_part>]; [<timerify_mode_part>])\
            |<timerify_mode_part> ([<timerify_temperature_part>]; [<timerify_percent_part>]))"
  TimerifyAddTime:
    data:
      - sentences:
          - "add (<timerify_duration>|<timerify_more_duration>) to [<the>] {timerify_target:name}"
          - "(<timerify_duration> more|<timerify_more_duration>) on [<the>] {timerify_target:name}"
          - "extend [<the>] {timerify_target:name} by <timerify_duration>"
  TimerifyStop:
    data:
      - sentences:
          - "(stop|cancel) [<the>] {timerify_target:name} timer"
          - "(stop|cancel) the timer (on|of) [<the>] {timerify_target:name}"
  TimerifyListCommands:
    data:
      - sentences:
          - "what is (planned|scheduled) for [<the>] {timerify_target:name}"
          - "what (commands are|is) pending (for|on) [<the>] {timerify_target:name}"
  TimerifyCancelCommands:
    data:
      - sentences:
          - "cancel (the|all) (planned|pending) commands (for|of) [<the>] {timerify_target:name}"
        slots:
          which: "all"
      - sentences:
          - "cancel the next (planned|pending) command (for|of) [<the>] {timerify_target:name}"
        slots:
          which: "next"
  TimerifySetSchedule:
    data:
      # The whole schedule of a device, or the interval of a title: on and off are
      # separate blocks, each fixing what it means. An interval is said by its title, or by
      # the time it starts at while Timerify made its title: timerify_interval holds both.
      # The schedule "of" and "for" a device are one, and on or off comes before the noun
      # or after it, since a phrasing that is left out here is not left alone: the
      # built-in agent takes "turn off the schedule for the boiler" for a turn off of the
      # boiler. So does it "turn off scheduling for the boiler", which is why "scheduling"
      # is a word for the schedule too, and the article before the noun is optional.
      - sentences:
          - "<turn> on [<the>] {timerify_target:name} (schedule|scheduling)"
          - "<turn> [<the>] {timerify_target:name} (schedule|scheduling) on"
          - "<turn> on [<the>] (schedule|scheduling) (of|for) [<the>] {timerify_target:name}"
          - "<turn> [<the>] (schedule|scheduling) (of|for) [<the>] {timerify_target:name} on"
          - "(enable|resume) [<the>] {timerify_target:name} (schedule|scheduling)"
          - "(enable|resume) [<the>] (schedule|scheduling) (of|for) [<the>] {timerify_target:name}"
          - "<turn> on [<the>] {timerify_interval:interval} (schedule|scheduling) (of|for) [<the>] {timerify_target:name}"
          - "<turn> [<the>] {timerify_interval:interval} (schedule|scheduling) (of|for) [<the>] {timerify_target:name} on"
          - "(enable|resume) [<the>] {timerify_interval:interval} (schedule|scheduling) (of|for) [<the>] {timerify_target:name}"
        slots:
          enabled: true
      - sentences:
          - "<turn> off [<the>] {timerify_target:name} (schedule|scheduling)"
          - "<turn> [<the>] {timerify_target:name} (schedule|scheduling) off"
          - "<turn> off [<the>] (schedule|scheduling) (of|for) [<the>] {timerify_target:name}"
          - "<turn> [<the>] (schedule|scheduling) (of|for) [<the>] {timerify_target:name} off"
          - "(disable|pause) [<the>] {timerify_target:name} (schedule|scheduling)"
          - "(disable|pause) [<the>] (schedule|scheduling) (of|for) [<the>] {timerify_target:name}"
          - "<turn> off [<the>] {timerify_interval:interval} (schedule|scheduling) (of|for) [<the>] {timerify_target:name}"
          - "<turn> [<the>] {timerify_interval:interval} (schedule|scheduling) (of|for) [<the>] {timerify_target:name} off"
          - "(disable|pause) [<the>] {timerify_interval:interval} (schedule|scheduling) (of|for) [<the>] {timerify_target:name}"
        slots:
          enabled: false
# How long: hours and minutes, each alone or both, or a phrase such as "half an hour";
# and how much more: "30 more minutes". Hours followed by a bare number of minutes
# ("1 hour 30") are a duration too. A thermostat and a water heater read that bare number as
# their temperature, so they need "and" between the hours and the minutes
# (timerify_duration_with_and, set in their blocks of TimerifyRun).
expansion_rules:
  timerify_spelled_duration: "(<timerify_hours_part> [[and] <timerify_minutes_part>]|<timerify_minutes_part>|{timerify_duration_words:minutes})"
  timerify_duration_with_and: "(<timerify_spelled_duration>|<timerify_hours_part> and {timerify_minutes_of_hour:minutes})"
  timerify_duration: "(<timerify_spelled_duration>|<timerify_hours_part> [and] {timerify_minutes_of_hour:minutes})"
  timerify_more_duration: "({timerify_hours:hours} more hour[s]|<timerify_minutes_count> more minute[s])"
  timerify_hours_part: "{timerify_hours:hours} hour[s]"
  timerify_minutes_part: "<timerify_minutes_count> minute[s]"
  timerify_minutes_count: "({timerify_minutes:minutes}|{timerify_long_minutes:minutes})"
# How long a command that turns a device on runs for, said before or after the delay of
# core_commands.yaml: "turn on the AC in 15 minutes for an hour".
  timerify_for_part: "for <timerify_duration>"
# A delay in days or weeks, or in a word ("in a day", "in half a day", "in a week"), one
# more way to say the delay of core_commands.yaml, after "in" or "after" or before "from
# now", "from today" or "later" ("turn on the boiler 2 days from now"). Home Assistant
# has no sentence for any of them, and its gazetteer takes "turn off the boiler in 2
# days" for a turn off of the device. A bare "later" is not a delay and is not said.
  timerify_own_delay: "((in|after) <timerify_own_span>|<timerify_own_span> (from (now|today)|later))"
  timerify_own_span: "({timerify_delay_days:delay_days}( |-)day[s]|{timerify_delay_weeks:delay_weeks}( |-)week[s]|{timerify_delay_words:delay_minutes})"
# A clock time, which core_commands.yaml says after the command, before it, and after how
# long it runs and the settings ("turn on the boiler at 7:30", "tomorrow at 7 turn on the
# boiler", "turn on the AC for an hour at 7:30"). An hour from 1 to 12 with no "am", "pm",
# part of the day or leading zero is the nearer of its two times, and the hour of 0 or 13
# to 23, or one written with a leading zero ("07:30"), is that of the 24-hour clock: the
# handler works that out from the text of the slot. A part of the day is said after the
# time ("at 7 in the morning") or before it, with a day or "in the" ("tomorrow morning at
# 7", "in the morning at 7").
# After the settings of a thermostat or a water heater the time must not be a bare hour or
# hour and minutes with a dot, which the temperature is said as ("for an hour at 21"):
# those blocks of TimerifyRun say that rule their own way, and the delayed commands take
# it from them. A part of the day before the hour is no temperature, so it is said there.
# The minutes after a separator are two digits (timerify_clock_minute), so that "at 7.5"
# and "at 22.5" are no time.
  timerify_clock_after_command: "<timerify_clock>"
  timerify_clock_after_extras: "<timerify_clock_after_command>"
  timerify_clock_before_command: "<timerify_clock>"
  timerify_clock: "(<timerify_clock_day> at <timerify_clock_time>|at <timerify_clock_time> [<timerify_clock_day>]|<timerify_clock_part_of_day>)"
  timerify_exact_clock: "(<timerify_clock_day> at <timerify_exact_time>|at <timerify_exact_time> [<timerify_clock_day>]|<timerify_clock_part_of_day>)"
  timerify_clock_day: "{timerify_clock_days:clock_day}"
  timerify_clock_part_of_day: "(<timerify_clock_when> at <timerify_part_hour>|at <timerify_part_hour> <timerify_clock_when>)"
  timerify_clock_when: "(<timerify_clock_day> {timerify_clock_part_words:clock_part}|[<timerify_clock_day>] in the {timerify_clock_part_words:clock_part})"
  timerify_part_hour: "({timerify_half_day_hours:clock_hour}(:| )<timerify_clock_minute>|{timerify_half_day_hours:clock_hour}.<timerify_clock_minute>|{timerify_half_day_hours:clock_hour} o'clock|{timerify_half_day_hours:clock_hour})"
  timerify_clock_minute: "({timerify_clock_minute_digits:clock_minute}|{timerify_clock_minute_words:clock_minute})"
  timerify_clock_time: "(<timerify_exact_time>|<timerify_loose_time>)"
  timerify_exact_time: "({timerify_clock_hours:clock_hour}(:| )<timerify_clock_minute>|{timerify_half_day_hours:clock_hour}(:| )<timerify_clock_minute> {timerify_day_parts:clock_part}|{timerify_clock_hours:clock_hour} o'clock|{timerify_half_day_hours:clock_hour} {timerify_day_parts:clock_part}|{timerify_clock_words:clock_part})"
  timerify_loose_time: "({timerify_clock_hours:clock_hour}|{timerify_clock_hours:clock_hour}.<timerify_clock_minute>|{timerify_half_day_hours:clock_hour}.<timerify_clock_minute> {timerify_day_parts:clock_part})"
# What to turn a device on with, in any order, each part left out when it is not wanted:
# an HVAC mode, a temperature, a percentage, and a mode of the device. Which of them a
# device may be turned on with is the rule timerify_settings of each block of TimerifyRun.
  timerify_hvac_part: "{timerify_hvac_mode:hvac_mode} [mode]"
  timerify_temperature_part: "[at] {timerify_temperature:temperature} [degree[s]]"
  timerify_percent_part: "[at] {timerify_percent:percent} percent"
  timerify_mode_part: "[in] [fan] {timerify_mode:mode} [mode|fan]"
lists:
  timerify_target:
    values: []
  # How long can be said reaches a week, in hours and in minutes: a timer never runs for
  # more than a day, and a duration beyond it must reach the handler, which clamps it when
  # time is added and refuses it when the timer is run, not be answered as not understood.
  # Minutes can be said as words up to a day; the minutes beyond it are a list of digits
  # only that fills the same slot, because the first request in a language builds a table
  # of the number words of every range that allows words, and for a week of minutes that
  # table takes seconds and over 100 MB (RULINGS.md, the duration entry).
  timerify_hours:
    range:
      from: 1
      to: 168
  timerify_minutes:
    range:
      from: 1
      to: 1440
  timerify_long_minutes:
    range:
      from: 1441
      to: 10080
      words: false
  # The minutes that follow the hours with no word for them: "1 hour 30".
  timerify_minutes_of_hour:
    range:
      from: 1
      to: 59
  # The days and the weeks of a delay: plain ranges, each in a slot of its own
  # (`delay_days`, `delay_weeks`), that the handler adds up with the other units of a delay.
  # A year of each is understood, so that a delay a command cannot wait is refused with
  # the limit (a week to turn on, a day to turn off) and no longer one is left to the
  # gazetteer. A range is not given a multiplier to count days as hours: hassil keeps the
  # words of a range by its bounds and not by its multiplier (`_RANGE_TRIE_CACHE` of
  # `hassil/string_matcher.py`), so such a range would be handed the words of any other
  # range with its bounds, and hand out its own.
  timerify_delay_days:
    range:
      from: 1
      to: 365
  timerify_delay_weeks:
    range:
      from: 1
      to: 52
  # The delays that are said in a word, in minutes: a day, half a day, a week.
  timerify_delay_words:
    values:
      - in: "a day"
        out: 1440
      - in: "half a day"
        out: 720
      - in: "a week"
        out: 10080
  # The parts of a clock time, each in the slot the handler of TimerifyCommandAt reads.
  # The hours of the 24-hour clock are for a time said without "am" or "pm", and the
  # hours of the 12-hour clock for one said with them. All are plain ranges.
  timerify_clock_hours:
    range:
      from: 0
      to: 23
  timerify_half_day_hours:
    range:
      from: 1
      to: 12
  # The minutes of a clock time said after a separator are two digits ("7:05", "7.05",
  # "7 05"), or number words ("seven thirty"); both fill the same slot. One digit is no
  # minute: "7.5" is not 7:05 and "22.5" is not 22:05.
  timerify_clock_minute_digits:
    values:
      - in: "00"
        out: 0
      - in: "01"
        out: 1
      - in: "02"
        out: 2
      - in: "03"
        out: 3
      - in: "04"
        out: 4
      - in: "05"
        out: 5
      - in: "06"
        out: 6
      - in: "07"
        out: 7
      - in: "08"
        out: 8
      - in: "09"
        out: 9
      - in: "10"
        out: 10
      - in: "11"
        out: 11
      - in: "12"
        out: 12
      - in: "13"
        out: 13
      - in: "14"
        out: 14
      - in: "15"
        out: 15
      - in: "16"
        out: 16
      - in: "17"
        out: 17
      - in: "18"
        out: 18
      - in: "19"
        out: 19
      - in: "20"
        out: 20
      - in: "21"
        out: 21
      - in: "22"
        out: 22
      - in: "23"
        out: 23
      - in: "24"
        out: 24
      - in: "25"
        out: 25
      - in: "26"
        out: 26
      - in: "27"
        out: 27
      - in: "28"
        out: 28
      - in: "29"
        out: 29
      - in: "30"
        out: 30
      - in: "31"
        out: 31
      - in: "32"
        out: 32
      - in: "33"
        out: 33
      - in: "34"
        out: 34
      - in: "35"
        out: 35
      - in: "36"
        out: 36
      - in: "37"
        out: 37
      - in: "38"
        out: 38
      - in: "39"
        out: 39
      - in: "40"
        out: 40
      - in: "41"
        out: 41
      - in: "42"
        out: 42
      - in: "43"
        out: 43
      - in: "44"
        out: 44
      - in: "45"
        out: 45
      - in: "46"
        out: 46
      - in: "47"
        out: 47
      - in: "48"
        out: 48
      - in: "49"
        out: 49
      - in: "50"
        out: 50
      - in: "51"
        out: 51
      - in: "52"
        out: 52
      - in: "53"
        out: 53
      - in: "54"
        out: 54
      - in: "55"
        out: 55
      - in: "56"
        out: 56
      - in: "57"
        out: 57
      - in: "58"
        out: 58
      - in: "59"
        out: 59
  timerify_clock_minute_words:
    range:
      from: 0
      to: 59
      digits: false
  # Which half of the day an hour of the 12-hour clock is in, said after the time. The
  # night is the small hours for 1 to 5 and the evening for 6 to 11.
  timerify_day_parts:
    values:
      - in: "(am|a.m.|in the morning)"
        out: am
      - in: "(pm|p.m.|in the afternoon|in the evening)"
        out: pm
      - in: "at night"
        out: night
  # The same parts as words that go with a day, before the time: "tomorrow morning at 7".
  timerify_clock_part_words:
    values:
      - in: "morning"
        out: am
      - in: "(afternoon|evening)"
        out: pm
      - in: "night"
        out: night
  # The times that are said in a word, which name their hour as well as their part of the
  # day: noon is 12 pm and midnight is 12 am. They fill the part and leave out the hour,
  # which the handler then takes to be 12, so that "at noon" is not the bare 12 of "at 12",
  # which is the nearer of noon and midnight.
  timerify_clock_words:
    values:
      - in: "noon"
        out: pm
      - in: "midnight"
        out: am
  # The day a time is said for, in days from today.
  timerify_clock_days:
    values:
      - in: "today"
        out: 0
      - in: "tomorrow"
        out: 1
      - in: "[the] day after tomorrow"
        out: 2
  # A temperature goes up to what a water heater is set at in Fahrenheit (110 to 140
  # degrees is usual, and water boils at 212), the bound the service form's selector has
  # too; the device refuses what it cannot take. The numbers may be said as words: the
  # table that costs is that of 500 numbers, a fraction of the minutes' (RULINGS.md).
  timerify_temperature:
    range:
      from: 1
      to: 250
      fractions: halves
  timerify_percent:
    range:
      from: 1
      to: 100
  timerify_duration_words:
    values:
      - in: "an hour"
        out: 60
      - in: "half an hour"
        out: 30
      - in: "an hour and a half"
        out: 90
  timerify_hvac_mode:
    values:
      - in: "(cool|cooling)"
        out: cool
      - in: "(heat|heating)"
        out: heat
      - in: "(dry|drying)"
        out: dry
      - in: "fan only"
        out: fan_only
      - in: "auto"
        out: auto
      - in: "heat and cool"
        out: heat_cool
  timerify_mode:
    values: []
  timerify_interval:
    values: []
# An answer calls the macros of macros.jinja by name.
responses:
  intents:
    TimerifyTimeLeft:
      default: |-
        {%- if slots.state == "counting" -%}
          {{ duration(slots.left_hours, slots.left_minutes) }} left on {{ slots.target }}, it turns off at {{ slots.ends_at }}{{ day(slots.ends_in_days) }}.
        {%- elif slots.state == "limit" -%}
          {{ slots.target }} turns off by {{ slots.ends_at }}{{ day(slots.ends_in_days) }} at the latest.
        {%- elif slots.state == "open" -%}
          {{ slots.target }} is on without a timer.
        {%- elif slots.state == "unavailable" -%}
          {{ slots.target }} is unavailable and has no timer.
        {%- else -%}
          {{ slots.target }} is off and has no timer.
        {%- endif -%}
    TimerifyRun:
      default: "{{ timer_now(slots) }}"
    TimerifyAddTime:
      default: "{{ timer_now(slots) }}"
    TimerifyStop:
      default: "{{ timer_now(slots) }}"
    TimerifyDelayedCommand:
      delayed: "{{ timer_later(slots) }}"
    TimerifyCommandAt:
      delayed: "{{ timer_later(slots) }}"
    TimerifyListCommands:
      default: |-
        {%- if slots.count == 0 -%}
          {{ slots.target }} has no planned commands.
        {%- else -%}
          {{ slots.target }} has {{ slots.count }} planned {{ plural(slots.count, "command", "commands") }}: {{ planned_commands(slots.commands) }}.
        {%- endif -%}
    TimerifyCancelCommands:
      default: |-
        {%- if slots.cancelled == 0 -%}
          {{ slots.target }} has no planned commands, so nothing was cancelled.
        {%- elif slots.which == "next" -%}
          Cancelled the next planned command for {{ slots.target }}: {{ planned_command(slots.commands[0]) }}.
        {%- else -%}
          Cancelled {{ slots.cancelled }} planned {{ plural(slots.cancelled, "command", "commands") }} for {{ slots.target }}.
        {%- endif -%}
    TimerifySetSchedule:
      default: |-
        {%- if slots.intervals | length == 1 -%}
          The {{ slots.intervals[0] }} schedule of {{ slots.target }} is {{ "on" if slots.enabled else "off" }}.
        {%- elif slots.intervals -%}
          The {{ titles_list(slots.intervals) }} schedules of {{ slots.target }} are {{ "on" if slots.enabled else "off" }}.
        {%- else -%}
          The schedule of {{ slots.target }} is {{ "on" if slots.enabled else "off" }}.
        {%- endif -%}
