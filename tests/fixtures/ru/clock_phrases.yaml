  said: "без двадцати восемь"
  now: "06:00"
  days: 0
  clock: "07:40"

- name: twenty-five short of eight
  said: "без двадцати пяти восемь"
  now: "06:00"
  days: 0
  clock: "07:35"

- name: five minutes short of eight
  said: "без пяти минут восемь"
  now: "06:00"
  days: 0
  clock: "07:55"

- name: one minute short of eight
  said: "без одной минуты восемь"
  now: "06:00"
  days: 0
  clock: "07:59"

- name: five short of one
  said: "без пяти час"
  now: "06:00"
  days: 0
  clock: "12:55"

- name: half of the first at night
  said: "в половине первого ночи"
  now: "06:00"
  days: 1
  clock: "00:30"

- name: half of the sixth at night
  said: "в половине шестого ночи"
  now: "06:00"
  days: 1
